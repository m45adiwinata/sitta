<!DOCTYPE html>
<html lang="id">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Login - SITTA</title>
	<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
	<link rel="stylesheet" href="css/style.css">
	<script src="js/data.js"></script>
</head>

<body>

	<div class="card">
		<h2>Selamat Datang</h2>

		<label for="email">Email</label>
		<input type="email" id="email" placeholder="Masukkan email" autocomplete="off" />
		<div class="error" id="emailError">Email tidak boleh kosong</div>

		<label for="password">Password</label>
		<input type="password" id="password" placeholder="Masukkan password" />
		<div class="error" id="passwordError">Password tidak boleh kosong</div>

		<a href="#" class="forgot" onclick="bukaModalLupaPassword()">Lupa password?</a>

		<button onclick="login()">Masuk</button>

		<div class="register">
			Belum punya akun? <a href="#" onclick="bukaModalDaftar()">Daftar</a>
		</div>
	</div>
	<!-- Modal Daftar -->
	<div class="modal-overlay" id="modalDaftar">
		<div class="modal">
			<div class="modal-header">
				<h3>Daftar Akun</h3>
				<button class="modal-close" onclick="tutupModalDaftar()">&#x2715;</button>
			</div>

			<label for="reg-nama">Nama</label>
			<input type="text" id="reg-nama" placeholder="Masukkan nama lengkap" autocomplete="off" />
			<div class="error" id="errorNama">Nama tidak boleh kosong</div>

			<label for="reg-email">Email</label>
			<input type="email" id="reg-email" placeholder="Masukkan email" autocomplete="off" />
			<div class="error" id="errorEmail">Email tidak boleh kosong</div>

			<label for="reg-password">Password</label>
			<input type="password" id="reg-password" placeholder="Masukkan password" />
			<div class="error" id="errorPassword">Password tidak boleh kosong</div>

			<label for="reg-role">Role</label>
			<select id="reg-role">
				<option value="">-- Pilih Role --</option>
				<option value="UPBJJ-UT">UPBJJ-UT</option>
				<option value="Puslaba">Puslaba</option>
				<option value="Fakultas">Fakultas</option>
				<option value="Administrator">Administrator</option>
			</select>
			<div class="error" id="errorRole">Role tidak boleh kosong</div>

			<label for="reg-lokasi">Lokasi</label>
			<input type="text" id="reg-lokasi" placeholder="Contoh: UPBJJ Makassar" />
			<div class="error" id="errorLokasi">Lokasi tidak boleh kosong</div>

			<button class="btn-daftar" onclick="daftar()">Daftar</button>
		</div>
	</div>
	<!-- Modal Lupa Password -->
	<div class="modal-overlay" id="modalLupaPassword">
		<div class="modal">
			<div class="modal-header">
				<h3>Lupa Password</h3>
				<button class="modal-close" onclick="tutupModalLupaPassword()">&#x2715;</button>
			</div>

			<label for="forget-email">Email</label>
			<input type="email" id="forget-email" placeholder="Masukkan email" autocomplete="off" />
			<div class="error" id="errorEmail">Email tidak boleh kosong</div>

			<button class="btn-daftar" onclick="lupaPassword()">Cek Password</button>
		</div>
	</div>

	<script src="js/login.js"></script>
	<script>
		function bukaModalDaftar() {
			document.getElementById('modalDaftar').classList.add('active');
		}
		function tutupModalDaftar() {
			document.getElementById('modalDaftar').classList.remove('active');
			document.getElementById('reg-nama').value = '';
			document.getElementById('reg-email').value = '';
			document.getElementById('reg-password').value = '';
			document.getElementById('reg-role').value = '';
			document.getElementById('reg-lokasi').value = '';
			document.getElementById('errorNama').style.display = 'none';
			document.getElementById('errorEmail').style.display = 'none';
			document.getElementById('errorPassword').style.display = 'none';
			document.getElementById('errorRole').style.display = 'none';
			document.getElementById('errorLokasi').style.display = 'none';
		}
		function bukaModalLupaPassword() {
			document.getElementById('modalLupaPassword').classList.add('active');
		}
		function tutupModalLupaPassword() {
			document.getElementById('modalLupaPassword').classList.remove('active');
			document.getElementById('reg-email').value = '';
			document.getElementById('errorEmail').style.display = 'none';
		}
	</script>

</body>

</html>
